name: Deploy Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            blog/package-lock.json
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Install Playground Dependencies
        run: npm ci --ignore-scripts
      - name: Install Blog Dependencies
        run: npm ci --ignore-scripts
        working-directory: ./blog
      - name: Build Website
        run: npm run build
      - name: Check Site Links
        run: npm run check
      - name: Check Sandwich Physics
        run: npm run test:sandwich
      - name: Audit Dependencies
        run: npm audit --prefix blog
      - name: Upload Website
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_final_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
