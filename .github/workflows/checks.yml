name: Site checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            blog/package-lock.json
      - name: Install Playground Dependencies
        run: npm ci --ignore-scripts
      - name: Install Blog Dependencies
        run: npm ci --prefix blog --ignore-scripts
      - name: Build Website
        run: npm run build
      - name: Check Site Links
        run: npm run check
      - name: Check Sandwich Physics
        run: npm run test:sandwich
      - name: Audit Playground Dependencies
        run: npm audit
      - name: Audit Dependencies
        run: |
          npm run test:audit
          npm run audit:blog
