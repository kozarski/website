			body {

			}

		</style>

	<body>
	
	

	
		<script type="text/javascript">

			var imageWidthHalf, imageHeightHalf;

			var canvas = document.createElement( 'canvas' );
			canvas.width = window.innerWidth;
			canvas.height = window.innerHeight;
			canvas.style.display = 'block';
			document.body.appendChild( canvas );

			var context = canvas.getContext( '2d' );

			var image = document.createElement( 'img' );

			image.addEventListener('load', function() {

				imageWidthHalf = Math.floor( this.width / 2 );
				imageHeightHalf = Math.floor( this.height / 2 );

				document.addEventListener( 'mousemove', onMouseEvent, false );
				document.addEventListener( 'touchstart', onTouchEvent, false );
				document.addEventListener( 'touchmove', onTouchEvent, false );

			}, false );

			image.src = "finder.png";

			function onMouseEvent( event ) {

				context.drawImage( image, event.clientX - imageWidthHalf, event.clientY - imageHeightHalf );

			}

			function onTouchEvent( event ) {

				event.preventDefault();

				for ( var i = 0; i < event.touches.length; i++ ) {

					context.drawImage( image, event.touches[i].pageX - imageWidthHalf, event.touches[i].pageY - imageHeightHalf );

				}

			}

		</script>
		
		<audio id="startup-sound" autoplay hidden preload="auto">
			<source src="95.mp3" type="audio/mpeg">
		</audio>
		<script>
			{
				const sound = document.getElementById('startup-sound');
				const interactions = ['click', 'touchend', 'keydown'];
				const playSound = () => sound.play().catch(() => {});

				interactions.forEach(type => document.addEventListener(type, playSound, { passive: true }));
				// Stop listening after autoplay or the first successful interaction.
				sound.addEventListener('playing', () => {
					interactions.forEach(type => document.removeEventListener(type, playSound));
				}, { once: true });
			}
		</script>
	</body>
