    <header>
      <h1>
        <label class="name-field" title="Name your sandwich">
          <span id="name-width" aria-hidden="true">world's best sandwich</span>
          <input id="sandwich-name" aria-label="Sandwich name" type="text" value="world's best sandwich" placeholder="world's best sandwich" maxlength="60" autocomplete="off" enterkeyhint="done" />
          <svg class="drawn-icon" viewBox="0 0 32 32" aria-hidden="true"><use href="#drawn-pencil"/></svg>
        </label>
      </h1>
    </header>
    <main id="playground" aria-label="Sandwich playground">
      <div
        id="scene"
        role="button"
        tabindex="0"
        aria-label="Drop the selected ingredient. Use arrow keys to aim, Enter or Space to drop, and Escape to put it back."
      ></div>
      <nav
        class="ingredients ingredients-left"
        aria-label="Breads, proteins and cheese"
      >
        <div class="ingredient-shelf" id="left-list"></div>
      </nav>
      <nav
        class="ingredients ingredients-right"
        aria-label="Vegetables, pickles and sauces"
      >
        <div class="ingredient-shelf" id="right-list"></div>
      </nav>
      <div id="error" role="alert" hidden></div>
      <noscript
        ><p class="fallback">
          Enable JavaScript to build your sandwich.
        </p></noscript
      >
    </main>
    <footer>
      <div class="controls" role="group" aria-label="Playground controls">
        <div class="control-slot control-left">
          <button id="undo" class="icon-control" type="button" aria-label="Undo last ingredient" title="Undo" disabled><svg class="drawn-icon" viewBox="0 0 32 32" aria-hidden="true"><use href="#drawn-undo"/></svg></button>
          <button id="keep-building" class="icon-control" type="button" aria-label="Keep building" title="Keep building" hidden><svg class="drawn-icon" viewBox="0 0 32 32" aria-hidden="true"><use href="#drawn-undo"/></svg></button>
        </div>
        <button id="serve" type="button" disabled aria-label="Ring bell and serve sandwich" title="Ring bell">
          <canvas class="service-bell" width="360" height="304" aria-hidden="true"></canvas>
          <svg class="bell-chime" viewBox="0 0 184 152" aria-hidden="true">
            <path d="M25 78l-6-10m-3-5-4-7"/>
            <path d="M45 44l-5-11m-3-6-3-8"/>
            <path d="M73 25l-2-10m-1-6-2-7"/>
            <path d="M92 18v-9m0-6v-7"/>
            <path d="M111 25l2-10m1-6 2-7"/>
            <path d="M139 44l5-11m3-6 3-8"/>
            <path d="M159 78l6-10m3-5 4-7"/>
          </svg>
        </button>
        <div class="control-slot control-right">
          <button id="reset" class="icon-control" type="button" aria-label="Reset sandwich" title="Reset" disabled>
            <svg class="drawn-icon" viewBox="0 0 32 32" aria-hidden="true"><use href="#drawn-trash"/></svg>
          </button>
          <button id="save-image" class="icon-control" type="button" aria-label="Save image" title="Save image" hidden>
            <svg class="drawn-icon" viewBox="0 0 32 32" aria-hidden="true"><use href="#drawn-camera"/></svg>
          </button>
        </div>
      </div>
    </footer>
    <button id="cut" class="knife-tool" type="button" aria-label="Cut sandwich in half" title="Cut in half" aria-pressed="false" hidden>
      <canvas class="resting-knife" width="400" height="152" aria-hidden="true"></canvas>
      <svg class="drawn-icon join-cue" viewBox="0 0 48 24" aria-hidden="true"><use href="#drawn-join"/></svg>
